name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm run test
      - run: git diff --check
      - run: git diff --exit-code

  rust:
    name: Rust format and tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, rust-src
      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      # `tauri::generate_context!` validates frontendDist at compile time. Library tests do
      # not need a production bundle, but they do require this configured path to exist.
      - name: Create frontend output placeholder for Tauri context
        run: mkdir -p dist
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: git diff --check
      - run: git diff --exit-code

  tauri-build:
    name: Linux Tauri build
    runs-on: ubuntu-22.04
    needs: [frontend, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            wget
      - run: npm ci
      - run: npm run tauri -- build --no-bundle
      - run: git diff --check
      - run: git diff --exit-code
