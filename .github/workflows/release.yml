name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            wget
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: npm run tauri -- build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/**/*.deb
            src-tauri/target/release/bundle/appimage/**/*.AppImage

  verify-linux-debian:
    name: Verify Linux Debian package
    needs: build-linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-bundles
          path: release-assets
      - name: Install, start, and uninstall the Debian package
        shell: bash
        run: |
          set -euo pipefail
          package="$(find release-assets -name '*.deb' -print -quit)"
          test -n "$package"
          sudo apt-get update
          sudo apt-get install --yes "$package" xvfb
          dpkg-query --show oxide-editor
          timeout --signal=TERM 15s xvfb-run --auto-servernum oxide-editor >/tmp/oxide-editor-launch.log 2>&1 &
          process_id=$!
          sleep 5
          if ! kill -0 "$process_id" 2>/dev/null; then
            cat /tmp/oxide-editor-launch.log
            exit 1
          fi
          kill "$process_id" || true
          wait "$process_id" || true
          sudo apt-get remove --yes oxide-editor
          ! dpkg-query --show oxide-editor

  build-windows:
    name: Build Windows packages
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: npm run tauri -- build --bundles msi,nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/**/*.msi
            src-tauri/target/release/bundle/nsis/**/*.exe

  build-macos:
    name: Build macOS packages
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: npm run tauri -- build --bundles app,dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-bundles
          if-no-files-found: error
          path: src-tauri/target/release/bundle/dmg/**/*.dmg

  publish-draft:
    name: Publish release candidate draft
    needs: [verify-linux-debian, build-windows, build-macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* SHA256SUMS.txt \
            --draft \
            --title "Oxide Editor $GITHUB_REF_NAME" \
            --generate-notes
