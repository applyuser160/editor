<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oxide Editor (VS Code on Tauri v2)</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- 1. Custom Title Bar (VS Code Dark+ Standard) -->
  <header id="titlebar">
    <div class="titlebar-left">
      <span class="app-icon">🦀</span>
      <span class="app-title">Oxide Editor</span>
      <nav class="menu-bar" id="top-menu-bar" aria-label="メインメニュー">
        <button class="menu-btn" data-menu="file">ファイル (File)</button>
        <button class="menu-btn" data-menu="edit">編集 (Edit)</button>
        <button class="menu-btn" data-menu="selection">選択 (Selection)</button>
        <button class="menu-btn" data-menu="view">表示 (View)</button>
        <button class="menu-btn" data-menu="go">移動 (Go)</button>
        <button class="menu-btn" data-menu="run">実行 (Run)</button>
        <button class="menu-btn" data-menu="terminal">ターミナル (Terminal)</button>
        <button class="menu-btn" data-menu="help">ヘルプ (Help)</button>
      </nav>
    </div>
    <div class="titlebar-center">
      <button class="quickopen-btn" id="trigger-quickopen">
        <span>🔍</span>
        <span class="quickopen-placeholder">Oxide Editor - ファイルまたはコマンドを検索 (Ctrl+P)</span>
      </button>
    </div>
    <div class="titlebar-right">
      <span id="window-status">Extension Host (Node.js) Ready</span>
    </div>
  </header>

  <!-- Global Dropdown Container for Top Menu (VS Code UI Level) -->
  <div id="menu-backdrop" class="menu-backdrop hidden"></div>
  <div id="global-menu-dropdown" class="hidden"></div>

  <!-- 2. Main Workbench Container -->
  <div id="workbench">
    <!-- Activity Bar -->
    <aside id="activity-bar" aria-label="アクティビティバー">
      <button class="activity-btn active" data-view="explorer" title="エクスプローラー (Ctrl+Shift+E)">📁</button>
      <button class="activity-btn" data-view="search" title="検索 (Ctrl+Shift+F)">🔍</button>
      <button class="activity-btn" data-view="scm" title="ソース管理 (Ctrl+Shift+G)">🌿</button>
      <button class="activity-btn" data-view="extensions" title="拡張機能 (Open VSX Marketplace) (Ctrl+Shift+X)">🧩</button>
      <div class="activity-bar-bottom">
        <button class="activity-btn" data-view="settings" title="設定 (Ctrl+,)">⚙</button>
      </div>
    </aside>

    <!-- Side Bar -->
    <aside id="sidebar" aria-label="サイドバー">
      <div class="sidebar-header">
        <span id="sidebar-title">エクスプローラー</span>
        <span id="workspace-name" title="現在開いているワークスペース"></span>
        <div class="sidebar-actions" id="sidebar-header-actions">
          <button id="btn-new-file" title="新規ファイル作成">📄+</button>
          <button id="btn-new-folder" title="新規フォルダ作成">📁+</button>
          <button id="btn-refresh-tree" title="再読み込み">🔄</button>
        </div>
      </div>
      <div id="sidebar-content"></div>
    </aside>

    <!-- Side Bar Resizer -->
    <div class="resizer horizontal" id="sidebar-resizer"></div>

    <!-- Main Editor & Terminal Area -->
    <main id="main-area" aria-label="エディターワークベンチ">
      <!-- Editor Part with 2D Grid Split Support -->
      <section id="editor-part">
        <div class="editor-header-row">
          <div id="tab-bar"></div>
          <div class="editor-actions">
            <button class="editor-action-btn" id="btn-split-right" title="エディターを右に分割 (Split Right)">◫</button>
            <button class="editor-action-btn" id="btn-split-down" title="エディターを下に分割 (Split Down)">⬒</button>
            <button class="editor-action-btn" id="btn-close-split" title="分割を閉じる (Close Split)">✕</button>
          </div>
        </div>
        <div id="breadcrumb-bar" class="breadcrumb-bar"></div>
        <div id="editor-grid">
          <div class="editor-pane" id="editor-pane-1">
            <div id="editor-container-1" style="width: 100%; height: 100%;"></div>
          </div>
          <div class="resizer horizontal hidden" id="grid-resizer"></div>
          <div class="editor-pane hidden" id="editor-pane-2">
            <div id="editor-container-2" style="width: 100%; height: 100%;"></div>
          </div>
        </div>
      </section>

      <!-- Terminal Resizer -->
      <div class="resizer vertical" id="terminal-resizer"></div>

      <!-- Bottom Panel (Terminal) -->
      <section id="panel-part" aria-label="下部パネル">
        <div class="panel-header">
          <div class="panel-header-tabs">
            <span class="panel-tab active" id="panel-tab-terminal">💻 ターミナル</span>
            <span class="panel-tab" id="panel-tab-output">出力</span>
            <span class="panel-tab" id="panel-tab-problems">問題</span>
          </div>
          <div class="panel-header-actions" id="terminal-actions">
            <div id="terminal-session-tabs" class="terminal-session-tabs"></div>
            <button id="btn-add-terminal" class="panel-action-btn" title="新規ターミナル (Ctrl+Shift+`)">+</button>
            <button id="btn-kill-terminal" class="panel-action-btn" title="ターミナルを終了">🗑</button>
            <button id="btn-close-panel" class="panel-action-btn" title="パネルを閉じる">×</button>
          </div>
        </div>
        <div id="terminal-container"></div>
        <div id="output-container" class="panel-content-area hidden" style="padding: 8px; font-family: monospace; font-size: 12px; color: #cccccc; overflow-y: auto; height: calc(100% - 30px);">
          <div style="color: #888;">[Oxide Output Channel] Extension Host & LSP Engine Ready.</div>
        </div>
        <div id="problems-container" class="panel-content-area hidden" style="padding: 8px; font-size: 12px; overflow-y: auto; height: calc(100% - 30px);">
          <div id="problems-tree"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- 3. Bottom Status Bar -->
  <footer id="statusbar">
    <div class="statusbar-left">
      <span class="status-item clickable" id="status-branch" title="クリックしてブランチを切り替え">🌿 main</span>
      <span class="status-item clickable" id="status-problems" title="問題パネルを開く">⚠️ 0  ❌ 0</span>
    </div>
    <div class="statusbar-right">
      <span class="status-item clickable" id="status-line-col" title="行へ移動 (Ctrl+G)">行: 1, 列: 1</span>
      <span class="status-item clickable" id="status-indent" title="インデントの変更">スペース: 4</span>
      <span class="status-item clickable" id="status-encoding" title="エンコーディングの変更">UTF-8</span>
      <span class="status-item clickable" id="status-eol" title="改行文字の変更">CRLF</span>
      <span class="status-item clickable" id="status-language" title="言語モードの選択">RUST</span>
      <span class="status-item highlight" id="global-status">準備完了</span>
    </div>
  </footer>

  <!-- 4. QuickPick Modal (Ctrl+P / Ctrl+Shift+P / Branch Switcher) -->
  <div id="quickpick-modal" class="hidden" role="dialog" aria-modal="true" aria-label="クイックオープン">
    <div class="quickpick-box">
      <div class="quickpick-input-wrapper">
        <span class="quickpick-icon">🔍</span>
        <input type="text" id="quickpick-input" placeholder="ファイル名で検索 (または '>' でコマンド)..." />
      </div>
      <div id="quickpick-list"></div>
    </div>
  </div>

  <!-- 5. Confirmation Modal (Save Changes on Close) -->
  <div id="confirm-modal" class="modal-overlay hidden">
    <div class="confirm-modal-box">
      <div class="confirm-modal-header">
        <span class="confirm-modal-icon">⚠️</span>
        <span id="confirm-modal-title" class="confirm-modal-title">変更を保存しますか？</span>
      </div>
      <div id="confirm-modal-message" class="confirm-modal-message">ファイルへの変更は保存しなければ失われます。</div>
      <div class="confirm-modal-actions">
        <button id="confirm-btn-save" class="btn btn-primary">保存 (Save)</button>
        <button id="confirm-btn-dontsave" class="btn btn-secondary">保存しない (Don't Save)</button>
        <button id="confirm-btn-cancel" class="btn btn-tertiary">キャンセル (Cancel)</button>
      </div>
    </div>
  </div>

  <!-- 6. Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Extension Detail Modal -->
  <div id="ext-detail-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="ext-detail-title">
    <div class="ext-detail-box">
      <div class="ext-detail-header">
        <img id="ext-detail-icon" src="" alt="Icon" />
        <div class="ext-detail-info">
          <div id="ext-detail-title" class="ext-detail-title"></div>
          <div id="ext-detail-id" class="ext-detail-id"></div>
          <div id="ext-detail-desc" class="ext-detail-desc"></div>
        </div>
        <button id="ext-detail-close" class="ext-detail-close" aria-label="拡張機能の詳細を閉じる">×</button>
      </div>
      <div class="ext-detail-actions">
        <button id="ext-detail-install-btn" class="btn-primary">インストール</button>
        <button id="ext-detail-uninstall-btn" class="btn-danger hidden">アンインストール</button>
      </div>
      <div id="ext-detail-readme" class="ext-detail-readme">
        Loading...
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
